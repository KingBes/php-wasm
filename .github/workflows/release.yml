name: Release

on:
  push:
    tags:
      - 'v*'

jobs:

  build-linux-x86_64:
    runs-on: ubuntu-latest
    name: Build for Linux x86_64

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install V
      run: |
        git clone --depth=1 https://github.com/vlang/v
        cd v
        make
        sudo ./v symlink
        v version

    - name: Build shared library
      run: |
        mkdir -p ./lib/linux
        v -cc gcc -shared ./core/php_wasm.v -o ./lib/linux/wasm.so

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: wasm-linux-x86_64
        path: ./lib/linux/wasm.so
        if-no-files-found: error

  build-macos-arm64:
    runs-on: macos-latest
    name: Build for macOS arm64

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install V
      run: |
        git clone --depth=1 https://github.com/vlang/v
        cd v
        make
        sudo ./v symlink
        v version

    - name: Build shared library
      run: |
        mkdir -p ./lib/macos
        v -cc gcc -shared ./core/php_wasm.v -o ./lib/macos/wasm.dylib

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: wasm-macos-arm64
        path: ./lib/macos/wasm.dylib
        if-no-files-found: error

  build-macos-x86_64:
    runs-on: macos-13
    name: Build for macOS x86_64

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install V
      run: |
        git clone --depth=1 https://github.com/vlang/v
        cd v
        make
        sudo ./v symlink
        v version

    - name: Build shared library
      run: |
        mkdir -p ./lib/macos
        v -cc gcc -shared ./core/php_wasm.v -o ./lib/macos/wasm.dylib

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: wasm-macos-x86_64
        path: ./lib/macos/wasm.dylib
        if-no-files-found: error

  build-windows-x86_64:
    runs-on: windows-latest
    name: Build for Windows x86_64

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install V
      run: |
        git clone --depth=1 https://github.com/vlang/v
        cd v
        .\make.bat
        set PATH=%CD%;%PATH%
        v version
      shell: cmd

    - name: Build shared library
      run: |
        if not exist ".\lib\windows" mkdir ".\lib\windows"
        v -cc gcc -shared .\core\php_wasm.v -o .\lib\windows\wasm.dll
      shell: cmd

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: wasm-windows-x86_64
        path: .\lib\windows\wasm.dll
        if-no-files-found: error

  release:
    name: Create Release
    needs:
      - build-linux-x86_64
      - build-macos-arm64
      - build-macos-x86_64
      - build-windows-x86_64
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: ./artifacts

    - name: Rename artifacts for release
      run: |
        mkdir -p ./release
        cp ./artifacts/wasm-linux-x86_64/wasm.so ./release/wasm-linux-x86_64.so
        cp ./artifacts/wasm-macos-arm64/wasm.dylib ./release/wasm-macos-arm64.dylib
        cp ./artifacts/wasm-windows-x86_64/wasm.dll ./release/wasm-windows-x86_64.dll

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ./release/wasm-linux-x86_64.so
          ./release/wasm-macos-arm64.dylib
          ./release/wasm-macos-x86_64.dylib
          ./release/wasm-windows-x86_64.dll
        generate_release_notes: true
