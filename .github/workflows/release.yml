name: Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  build-linux-x86_64:
    runs-on: ubuntu-latest
    name: Build for Linux x86_64

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install V
      run: |
        git clone --depth=1 https://github.com/vlang/v
        cd v
        make
        sudo ./v symlink
        v version

    - name: Build shared library
      run: |
        mkdir -p ./lib/linux
        v -cc gcc -shared ./core/php_wasm.v -o ./lib/linux/wasm.so

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: wasm-linux-x86_64
        path: ./lib/linux/wasm.so
        if-no-files-found: error

  build-linux-arm64:
    runs-on: ubuntu-latest
    name: Build for Linux arm64
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build on ARM64
      uses: uraimo/run-on-arch-action@v2
      with:
        arch: aarch64
        distro: ubuntu22.04
        run: |
          apt-get update && apt-get install -y curl unzip gcc
          curl -L -o v.zip https://github.com/vlang/v/releases/latest/download/v_linux_arm64.zip
          unzip -o v.zip
          rm v.zip
          mkdir -p ./lib/linux
          ./v/v -cc gcc -shared ./core/php_wasm.v -o ./lib/linux/wasm.so

    - name: Download artifact
      uses: actions/upload-artifact@v4
      with:
        name: wasm-linux-arm64
        path: ./lib/linux/wasm.so
        if-no-files-found: error

  build-macos-arm64:
    runs-on: macos-latest
    name: Build for macOS arm64

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install V
      run: |
        git clone --depth=1 https://github.com/vlang/v
        cd v
        make
        sudo ./v symlink
        v version

    - name: Build shared library
      run: |
        mkdir -p ./lib/macos
        v -cc gcc -shared ./core/php_wasm.v -o ./lib/macos/wasm.dylib

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: wasm-macos-arm64
        path: ./lib/macos/wasm.dylib
        if-no-files-found: error

  release:
    name: Create Release
    needs:
      - build-linux-x86_64
      - build-linux-arm64
      - build-macos-arm64
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: ./artifacts

    - name: Rename artifacts for release
      run: |
        mkdir -p ./release
        cp ./artifacts/wasm-linux-x86_64/wasm.so ./release/wasm-linux-x86_64.so
        cp ./artifacts/wasm-linux-arm64/wasm.so ./release/wasm-linux-arm64.so
        cp ./artifacts/wasm-macos-arm64/wasm.dylib ./release/wasm-macos-arm64.dylib

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ./release/wasm-linux-x86_64.so
          ./release/wasm-linux-arm64.so
          ./release/wasm-macos-arm64.dylib
        generate_release_notes: true
